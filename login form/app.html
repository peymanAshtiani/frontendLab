<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login form</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="container">
      <div class="login-card">
        <form class="container-box">
          <h1 class="header"><span class="login">Login</span> Your Account</h1>
          <input
            class="container-item"
            type="text"
            id="Username"
            placeholder="Username"
          />
          <input
            class="container-item"
            type="email"
            id="email"
            placeholder="Your email"
          />
          <input
            class="container-item"
            type="password"
            id="password"
            placeholder="password"
          />
          <button class="container-btn">Login</button>
        </form>
        <div class="form-footer">
          <a href="#" class="btn">Forgot password?</a>
          <a href="#" class="btn-account">Create Account</a>
        </div>
      </div>
    </div>
  </body>
</html>
